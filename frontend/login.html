<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - IGNITE Bias Auditor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&amp;family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#001e2c",
                        "surface-container-low": "#f0f3ff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#ebf1ff",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#775a00",
                        "outline-variant": "#d2c5ae",
                        "surface-container-highest": "#dce2f3",
                        "secondary-container": "#dcdff1",
                        "primary-container": "#f0c040",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#7ad0ff",
                        "on-secondary-fixed-variant": "#434654",
                        "on-tertiary-container": "#005979",
                        "primary-fixed": "#ffdf97",
                        "background": "#f9f9ff",
                        "primary-fixed-dim": "#f0c040",
                        "tertiary-fixed": "#c3e7ff",
                        "on-primary-fixed": "#251a00",
                        "on-surface-variant": "#4e4635",
                        "on-tertiary-fixed-variant": "#004c69",
                        "inverse-primary": "#f0c040",
                        "surface-variant": "#dce2f3",
                        "error": "#ba1a1a",
                        "surface-dim": "#d3daea",
                        "on-secondary-container": "#5e6271",
                        "surface-container": "#e7eefe",
                        "surface": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "outline": "#807662",
                        "inverse-surface": "#2a313d",
                        "surface-container-high": "#e2e8f8",
                        "on-background": "#151c27",
                        "secondary": "#5a5e6d",
                        "tertiary-container": "#79d0ff",
                        "on-secondary-fixed": "#171b28",
                        "on-secondary": "#ffffff",
                        "tertiary": "#00668a",
                        "on-surface": "#151c27",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#5a4400",
                        "secondary-fixed": "#dfe2f3",
                        "surface-tint": "#775a00",
                        "secondary-fixed-dim": "#c3c6d7",
                        "on-primary-container": "#684f00",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "xs": "4px",
                        "xl": "80px",
                        "md": "24px",
                        "base": "8px",
                        "lg": "48px"
                    },
                    "fontFamily": {
                        "h3": ["Playfair Display"],
                        "label-caps": ["DM Mono"],
                        "body-md": ["DM Sans"],
                        "h2": ["Playfair Display"],
                        "body-lg": ["DM Sans"],
                        "body-sm": ["DM Sans"],
                        "code": ["DM Mono"],
                        "h1": ["Playfair Display"]
                    },
                    "fontSize": {
                        "h3": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],

                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

                    }

</head>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center relative p-6">
    <div class="absolute top-6 right-6">
        <button aria-label="Toggle dark mode"
            class="p-2 rounded-full hover:bg-surface-variant transition-colors duration-200 text-on-surface">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">light_mode</span>
        </button>
    </div>
    <div
        class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-outline-variant/30 p-8">
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-on-primary-container text-2xl"
                    style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
            </div>
            <h1 class="font-h2 text-h2 text-on-surface mb-2 text-center">Welcome back</h1>
            <p class="font-body-md text-body-md text-on-surface-variant text-center">Sign in to your account</p>
        </div>
        <form id="login-form" class="space-y-6"></form>
            <div class="space-y-2">
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wide"
                    for="email">Email</label>
                <input
                    class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-200"
                    id="email" placeholder="name@company.com" required="" type="email" />
            </div>
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wide"
                        for="password">Password</label>
                    <a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors duration-200"
                        href="#">Forgot password?</a>
                </div>
                <div class="relative">
                    <input
                        class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-200 pr-12"
                        id="password" placeholder="••••••••" required="" type="password" />
                    <button aria-label="Toggle password visibility"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors duration-200"
                        onclick="const input = document.getElementById('password'); const icon = this.querySelector('span'); if (input.type === 'password') { input.type = 'text'; icon.textContent = 'visibility_off'; } else { input.type = 'password'; icon.textContent = 'visibility'; }"
                        type="button">
                        <span class="material-symbols-outlined"
                            style="font-variation-settings: 'FILL' 0;">visibility</span>
                    </button>
                </div>
            </div>
            <button
                class="w-full h-12 bg-primary-container hover:bg-primary-fixed text-on-primary-fixed font-body-md text-body-md font-medium rounded-lg transition-colors duration-200 flex items-center justify-center"
                type="submit">
                Sign In
            </button>
        </form>
        <div class="mt-8 mb-8 relative">
            <div aria-hidden="true" class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-outline-variant"></div>
            </div>
            <div class="relative flex justify-center">
                <span
                    class="px-4 bg-surface-container-lowest font-body-sm text-body-sm text-on-surface-variant">or</span>
            </div>
        </div>
        <button
            class="w-full h-12 border border-outline-variant hover:bg-surface-variant text-on-surface font-body-md text-body-md font-medium rounded-lg transition-colors duration-200 flex items-center justify-center gap-3"
            type="button">
            <svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4"></path>
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853"></path>
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05"></path>
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335"></path>
            </svg>
            Sign in with Google
        </button>
        <div class="mt-8 text-center">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account?
                <a class="text-primary hover:text-primary-container font-medium transition-colors duration-200"
                    href="signup.html">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Firebase Auth -->
    <script type="module" src="./js/auth.js"></script>

</body>

</html>
