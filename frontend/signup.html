<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-md">
    <!-- Top Right Actions -->
    <div class="fixed top-md right-md flex gap-sm">
        <button aria-label="Toggle dark mode"
            class="p-base text-secondary hover:text-primary transition-colors duration-200 bg-surface-container-low rounded-full shadow-sm">
            <span class="material-symbols-outlined">light_mode</span>
        </button>
    </div>
    <!-- Main Container -->
    <main
        class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant p-lg flex flex-col gap-md">
        <!-- Header -->
        <div class="text-center flex flex-col items-center gap-xs">
            <div class="font-h1 text-h1 text-primary-fixed-dim mb-sm tracking-tighter">IGNITE</div>
            <h1 class="font-h2 text-h2 text-on-surface">Create your account</h1>
            <p class="font-body-md text-body-md text-on-surface-variant">Join IGNITE Bias Auditor</p>
        </div>
        <!-- Form -->
        <form class="flex flex-col gap-md mt-sm">
            <!-- Full Name -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-caps text-label-caps text-on-surface" for="fullName">Full Name</label>
                <input
                    class="w-full px-sm py-[10px] rounded bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors placeholder:text-outline"
                    id="fullName" placeholder="Dr. Jane Doe" type="text" />
            </div>
            <!-- Email -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-caps text-label-caps text-on-surface" for="email">Email</label>
                <input
                    class="w-full px-sm py-[10px] rounded bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors placeholder:text-outline"
                    id="email" placeholder="jane.doe@institution.edu" type="email" />
            </div>
            <!-- Password -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-caps text-label-caps text-on-surface" for="password">Password</label>
                <input
                    class="w-full px-sm py-[10px] rounded bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors placeholder:text-outline"
                    id="password" placeholder="••••••••" type="password" />
                <!-- Strength Indicator -->
                <div class="flex gap-xs mt-1">
                    <div class="h-1 flex-1 bg-surface-container-highest rounded-full overflow-hidden">
                        <div class="h-full bg-primary-fixed-dim w-1/3"></div>
                    </div>
                    <div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
                    <div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
                    <div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
                </div>
                <p class="font-body-sm text-body-sm text-on-surface-variant text-xs mt-1">Weak: Add numbers and symbols
                </p>
            </div>
            <!-- Confirm Password -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-caps text-label-caps text-on-surface" for="confirmPassword">Confirm
                    Password</label>
                <input
                    class="w-full px-sm py-[10px] rounded bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors placeholder:text-outline"
                    id="confirmPassword" placeholder="••••••••" type="password" />
            </div>
            <!-- Primary Action -->
            <button
                class="w-full bg-primary-container text-on-primary-container font-body-md text-body-md font-medium py-sm rounded-lg hover:bg-primary-fixed hover:shadow-md active:scale-[0.98] transition-all duration-200 mt-sm"
                type="button">
                Create Account
            </button>
            <!-- Divider -->
            <div class="flex items-center gap-sm my-sm">
                <div class="flex-1 h-px bg-outline-variant"></div>
                <span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
                <div class="flex-1 h-px bg-outline-variant"></div>
            </div>
            <!-- OAuth Action -->
            <button
                class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md font-medium py-sm rounded-lg hover:bg-surface-container-low transition-colors duration-200 flex items-center justify-center gap-sm"
                type="button">
                <img alt="Google logo" class="w-5 h-5"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuANu0wIbKKoOiyAOqQ_l6IJYjYMcrB2N2KpCaaTdYybURwWBtwwjdNAS3Gc5g1j40_bkrJDUpYEGbIw4Lb8ZgSUZNdc8oykZ90W3dfg-ffk7mp5_G57sj20o-NMwp8W82-tnPuhi3fTj8Z_oATJNQVU9LDx0Ac-zyc2mmqJ55_PT07K7d4JVLnYRdkJZpGnEsjk5fnSR1dH-rbhsNcifnGIo33GRU9R3cSfx3kHH8oGa1FwUmhTF6VILElc7abYgs2MCnPN0A34jCA" />
                Continue with Google
            </button>
        </form>
        <!-- Footer Links -->
        <div class="text-center mt-md">
            <a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-dim underline transition-colors"
                href="login.html">Already have an account? Sign in</a>
        </div>
    </main>
    <!-- Legal Footer -->
    <footer class="mt-lg text-center max-w-[420px] opacity-80">
        <p class="font-body-sm text-body-sm text-on-surface-variant text-xs">
            By creating an account, you agree to our
            <a class="underline hover:text-primary" href="#">Terms of Service</a> and
            <a class="underline hover:text-primary" href="#">Privacy Policy</a>.
        </p>
    </footer>

    <!-- Firebase Auth -->
<script type="module" src="./js/auth.js"></script>
</body>

</html>
